apiVersion: v1
kind: Service
metadata:
  name: iris-api-service
  labels:
    app: iris-api #This must match the label in your deployment
spec:
  type: LoadBalancer
  selector:
    app: iris-api
  ports:
  - port: 80 # The public port to expose
    targetPort: 8000  # Your container's port
    protocol: TCP
    name: http
  sessionAffinity: None