  #       value: 2
  #       periodSeconds: 15
  #     selectPolicy: Max
  #   scaleDown:
  #     stabilizationWindowSeconds: 60
  #     policies:
  #     - type: Percent
  #       value: 50
  #       periodSeconds: 30