apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iris-api-hpa
spec:
  # This points the HPA at your deployment
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: iris-api-deployment # Must match your Deployment's name
    
  # --- SCALING RULES ---
  
  minReplicas: 3   # The minimum number of pods to run
  maxReplicas: 10  # The maximum number of pods to scale up to
  
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        # Target 80% of the requested CPU (your request is 250m)
        averageUtilization: 70 
        
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        # Target 80% of the requested memory (your request is 256Mi)
        averageUtilization: 80