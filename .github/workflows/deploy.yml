name: Build, Deploy, and Test

on:
  push:
    branches: 
      - week7

env:
  GAR_LOCATION: "us-central1"
  GKE_CLUSTER: "iris-cluster"
  GKE_REGION: "us-central1"
  REPOSITORY: "iris-app-repo"
  IMAGE_NAME: "iris-api"
  DEPLOYMENT_NAME: "iris-api-deployment"
  SERVICE_NAME: "iris-api-service"

jobs:
  build-deploy-test:
    name: Build, Deploy, and Test
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
      pull-requests: write 

    steps:
      # ============================================
      # STEP 1: CHECKOUT CODE
      # ============================================
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # ============================================
      # STEP 2: AUTHENTICATE TO GCP
      # ============================================
      - name: 🔐 Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ============================================
      # STEP 3: CONFIGURE DOCKER FOR ARTIFACT REGISTRY
      # ============================================
      - name: 🐳 Configure Docker for Artifact Registry
        run: |
          echo "Configuring Docker authentication..."
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet
      # ============================================
      # STEP 4: BUILD AND PUSH DOCKER IMAGE
      # ============================================
      - name: 🏗️ Build and Push Docker Image
        id: build
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          
          echo "📦 Building image: $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" .
          
          echo "⬆️ Pushing image to Artifact Registry..."
          docker push "$IMAGE_TAG"
          
          echo "✅ Successfully pushed: $IMAGE_TAG"
          
          # Save for later steps
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
      # ============================================
      # STEP 5: INSTALL GKE AUTH PLUGIN
      # ============================================
      - name: 🔧 Install GKE Auth Plugin
        run: |
          echo "Installing gke-gcloud-auth-plugin..."
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates gnupg
          echo "deb [signed-by=/usr/share/keyrings/google-cloud.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
          curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/google-cloud.gpg
          sudo apt-get update -y
          sudo apt-get install -y google-cloud-cli-gke-gcloud-auth-plugin
          echo "✅ Plugin installed"
      # ============================================
      # STEP 6: GET GKE CREDENTIALS
      # ============================================
      - name: ☸️ Get GKE Cluster Credentials
        run: |
          echo "Getting cluster credentials..."
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} --region ${{ env.GKE_REGION }}
          
          echo "🔍 Verifying cluster connection..."
          kubectl cluster-info
          kubectl get nodes
      # ============================================
      # STEP 7: DEPLOY TO GKE
      # ============================================
      - name: 🚀 Deploy to GKE
        run: |
          echo "Deploying to GKE..."
          
          # Verify image tag
          if [ -z "$IMAGE_TAG" ]; then
            echo "❌ ERROR: Image tag is empty!"
            exit 1
          fi
          
          echo "📝 Updating deployment with image: $IMAGE_TAG"
          
          # Check if deployment.yaml exists and update it
          if [ -f "gke-deploy/deployment.yaml" ]; then
            sed -i "s|image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:.*|image: $IMAGE_TAG|g" gke-deploy/deployment.yaml
            
            echo "🔍 Verifying image tag update:"
            grep "image: ${{ env.GAR_LOCATION }}-docker.pkg.dev" gke-deploy/deployment.yaml
            
            echo "📋 Applying Kubernetes manifests..."
            kubectl apply -f gke-deploy/deployment.yaml
            
            if [ -f "gke-deploy/service.yaml" ]; then
              kubectl apply -f gke-deploy/service.yaml
            fi
            
            if [ -f "gke-deploy/hpa.yaml" ]; then
              kubectl apply -f gke-deploy/hpa.yaml
            fi
          else
            # Fallback: Update existing deployment directly
            echo "Using kubectl set image (no deployment.yaml found)..."
            kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
              iris-api-container=$IMAGE_TAG \
              --record
          fi
          
          echo "⏳ Waiting for deployment rollout..."
          if ! kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} --timeout=300s; then
            echo "❌ Deployment rollout failed!"
            echo ""
            echo "📦 Pod status:"
            kubectl get pods -l app=${{ env.IMAGE_NAME }} -o wide
            echo ""
            echo "📝 Deployment details:"
            kubectl describe deployment ${{ env.DEPLOYMENT_NAME }}
            echo ""
            echo "📜 Pod logs:"
            kubectl logs -l app=${{ env.IMAGE_NAME }} --tail=50 || echo "No logs available"
            exit 1
          fi
          
          echo "✅ Deployment successful!"
          echo ""
          echo "📊 Deployment status:"
          kubectl get deployment ${{ env.DEPLOYMENT_NAME }}
          echo ""
          echo "📦 Running pods:"
          kubectl get pods -l app=${{ env.IMAGE_NAME }}
      # ============================================
      # STEP 8: WAIT FOR SERVICE TO BE READY
      # ============================================
      - name: ⏳ Wait for Service External IP
        run: |
          echo "Waiting for LoadBalancer to assign external IP..."
          
          ATTEMPTS=0
          MAX_ATTEMPTS=30
          
          while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            SERVICE_IP=$(kubectl get service ${{ env.SERVICE_NAME }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
            
            if [ -n "$SERVICE_IP" ]; then
              echo "✅ Service is live at: http://$SERVICE_IP"
              echo "SERVICE_IP=$SERVICE_IP" >> $GITHUB_ENV
              break
            fi
            
            ATTEMPTS=$((ATTEMPTS + 1))
            echo "Attempt $ATTEMPTS/$MAX_ATTEMPTS: Waiting for IP..."
            sleep 10
          done
          
          if [ -z "$SERVICE_IP" ]; then
            echo "❌ LoadBalancer IP not assigned after $MAX_ATTEMPTS attempts"
            exit 1
          fi
      # ============================================
      # STEP 9: TEST THE ENDPOINT
      # ============================================
      - name: 🧪 Test Live Endpoint
        if: env.SERVICE_IP != ''
        run: |
          echo "Testing endpoint at: http://$SERVICE_IP"
          
          # Wait a bit for the service to be fully ready
          echo "Waiting 30 seconds for service to stabilize..."
          sleep 30
          
          echo "Running prediction test..."
          
          HTTP_CODE=$(curl -s -o prediction.json -w "%{http_code}" \
            -X POST "http://$SERVICE_IP:80/predict" \
            -H "Content-Type: application/json" \
            -d '{"sepal_length": 5.1, "sepal_width": 3.5, "petal_length": 1.4, "petal_width": 0.2}')
          
          echo "HTTP Response Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Endpoint is responding correctly!"
            echo "Response:"
            cat prediction.json
            echo ""
          else
            echo "❌ Unexpected response code: $HTTP_CODE"
            echo "Response:"
            cat prediction.json || echo "No response body"
            exit 1
          fi
      # ============================================
      # STEP 10: INSTALL WRK FOR LOAD TESTING
      # ============================================
      - name: 📦 Install WRK Load Testing Tool
        run: |
          echo "Installing WRK..."
          sudo apt-get install -y wrk        
          echo "✅ WRK installed successfully"
      # ============================================
      # STEP 11: PREPARE LOAD TEST SCRIPT
      # ============================================
      - name: 📝 Create WRK Load Test Script
        run: |
          cat > load_test.lua << 'EOF'
          -- WRK Load Testing Script for Iris Prediction API
            math.randomseed(os.time())

            local iris_samples = {
                { sepal_length = 5.1, sepal_width = 3.5, petal_length = 1.4, petal_width = 0.2 },
                { sepal_length = 4.9, sepal_width = 3.0, petal_length = 1.4, petal_width = 0.2 },
                { sepal_length = 5.4, sepal_width = 3.9, petal_length = 1.7, petal_width = 0.4 },
                { sepal_length = 7.0, sepal_width = 3.2, petal_length = 4.7, petal_width = 1.4 },
                { sepal_length = 6.4, sepal_width = 3.2, petal_length = 4.5, petal_width = 1.5 },
                { sepal_length = 6.9, sepal_width = 3.1, petal_length = 4.9, petal_width = 1.5 },
                { sepal_length = 6.3, sepal_width = 3.3, petal_length = 6.0, petal_width = 2.5 },
                { sepal_length = 7.1, sepal_width = 3.0, petal_length = 5.9, petal_width = 2.1 },
                { sepal_length = 6.5, sepal_width = 3.0, petal_length = 5.8, petal_width = 2.2 }
            }

            request = function()
                local sample = iris_samples[math.random(#iris_samples)]

                local body = string.format(
                    '{"sepal_length": %.1f, "sepal_width": %.1f, "petal_length": %.1f, "petal_width": %.1f}',
                    sample.sepal_length, sample.sepal_width, sample.petal_length, sample.petal_width
                )

                return wrk.format("POST", "/predict", {
                    ["Content-Type"] = "application/json",
                    ["Accept"] = "application/json"
                }, body)
            end

            done = function(summary, latency, requests)
                local total_requests = summary.requests
                local error_count = summary.errors.connect + summary.errors.read + summary.errors.write + summary.errors.status + summary.errors.timeout
                local success_count = total_requests - error_count

                print("\n========================================")
                print("Load Test Summary")
                print("========================================")
                print(string.format("Total Requests:    %d", total_requests))
                print(string.format("Successful:        %d (%.2f%%)", success_count, (success_count/total_requests)*100))
                print(string.format("Failed:            %d (%.2f%%)", error_count, (error_count/total_requests)*100))
                print(string.format("Duration:          %.2f seconds", summary.duration / 1000000))
                print(string.format("Requests/sec:      %.2f", summary.requests / (summary.duration / 1000000)))
                print(string.format("Data transferred:  %.2f MB", summary.bytes / (1024 * 1024)))
                print("\n--- Latency Statistics ---")
                print(string.format("Min:               %.2f ms", latency.min / 1000))
                print(string.format("Max:               %.2f ms", latency.max / 1000))
                print(string.format("Mean:              %.2f ms", latency.mean / 1000))
                print(string.format("Stdev:             %.2f ms", latency.stdev / 1000))
                print(string.format("50th percentile:   %.2f ms", latency:percentile(50) / 1000))
                print(string.format("75th percentile:   %.2f ms", latency:percentile(75) / 1000))
                print(string.format("90th percentile:   %.2f ms", latency:percentile(90) / 1000))
                print(string.format("99th percentile:   %.2f ms", latency:percentile(99) / 1000))
                print("\n--- Error Breakdown ---")
                print(string.format("Connect errors:    %d", summary.errors.connect))
                print(string.format("Read errors:       %d", summary.errors.read))
                print(string.format("Write errors:      %d", summary.errors.write))
                print(string.format("Status errors:     %d", summary.errors.status))
                print(string.format("Timeout errors:    %d", summary.errors.timeout))
                print("========================================\n")
            end
          EOF
          
          echo "✅ Load test script created"
          cat load_test.lua
      # ============================================
      # STEP 12: RECORD PRE-LOAD TEST STATE
      # ============================================
      - name: 📊 Record Initial Pod State
        run: |
          echo "Recording initial pod state before load test..."
          echo ""
          echo "📦 Current pods:"
          kubectl get pods -l app=${{ env.IMAGE_NAME }} -o wide
          echo ""
          echo "📈 Current HPA status:"
          kubectl get hpa
          echo ""
          echo "Initial pod count:" > load_test_results.txt
          INITIAL_PODS=$(kubectl get pods -l app=${{ env.IMAGE_NAME }} --no-headers | wc -l)
          echo "$INITIAL_PODS" >> load_test_results.txt
          echo "Initial pods: $INITIAL_PODS"
          echo "INITIAL_PODS=$INITIAL_PODS" >> $GITHUB_ENV
      # ============================================
      # STEP 13: RUN STRESS TEST WITH WRK
      # ============================================
      - name: 🔥 Run WRK Stress Test (>1000 requests)
        run: |
          echo "========================================="
          echo "🔥 Starting WRK Stress Test"
          echo "========================================="
          echo "Target: http://$SERVICE_IP/predict"
          echo "Configuration:"
          echo "  - Threads: 4"
          echo "  - Connections: 50"
          echo "  - Duration: 60 seconds"
          echo "  - Expected requests: >1000"
          echo "========================================="
          echo ""
          
          # Run WRK load test
          wrk -t4 -c50 -d30s -s load_test.lua http://$SERVICE_IP 2>&1 | tee wrk_output.txt
          
          echo ""
          echo "✅ Load test completed"
          
          # Extract key metrics
          TOTAL_REQUESTS=$(grep -oP "(?<=Total Requests:\s{4})\d+" wrk_output.txt || echo "0")
          REQUESTS_PER_SEC=$(grep -oP "(?<=Requests/sec:\s{6})[0-9.]+(?= )" wrk_output.txt || echo "0")
          
          echo ""
          echo "Total Requests: $TOTAL_REQUESTS"
          echo "Requests/sec: $REQUESTS_PER_SEC"
          
          echo "" >> load_test_results.txt
          echo "Total Requests: $TOTAL_REQUESTS" >> load_test_results.txt
          echo "Requests per second: $REQUESTS_PER_SEC" >> load_test_results.txt
      # ============================================
      # STEP 14: MONITOR AUTO-SCALING
      # ============================================
      - name: 📈 Monitor Kubernetes Auto-Scaling
        run: |
          echo "========================================="
          echo "📈 Monitoring Auto-Scaling Activity"
          echo "========================================="
          
          # Monitor for 2 minutes to observe scaling
          MONITORING_DURATION=120
          INTERVAL=10
          ITERATIONS=$((MONITORING_DURATION / INTERVAL))
          
          echo "Monitoring for $MONITORING_DURATION seconds..."
          echo ""
          
          for i in $(seq 1 $ITERATIONS); do
            echo "--- Check $i/$ITERATIONS ($(date +%H:%M:%S)) ---"
            
            POD_COUNT=$(kubectl get pods -l app=${{ env.IMAGE_NAME }} --no-headers | grep -c "Running" || echo "0")
            echo "Running pods: $POD_COUNT"
            
            echo "Pod status:"
            kubectl get pods -l app=${{ env.IMAGE_NAME }} -o wide
            
            echo ""
            echo "HPA status:"
            kubectl get hpa
            
            echo ""
            echo "HPA description:"
            kubectl describe hpa 2>/dev/null || echo "No HPA configured"
            
            echo ""
            echo "----------------------------------------"
            echo ""
            
            sleep $INTERVAL
          done
          
          # Record final state
          FINAL_PODS=$(kubectl get pods -l app=${{ env.IMAGE_NAME }} --no-headers | grep -c "Running" || echo "0")
          MAX_PODS=$(kubectl get hpa -o jsonpath='{.items[0].spec.maxReplicas}' 2>/dev/null || echo "N/A")
          
          echo "" >> load_test_results.txt
          echo "Final pod count: $FINAL_PODS" >> load_test_results.txt
          echo "Max pods allowed: $MAX_PODS" >> load_test_results.txt
          
          echo "FINAL_PODS=$FINAL_PODS" >> $GITHUB_ENV
          echo "MAX_PODS=$MAX_PODS" >> $GITHUB_ENV
      # ============================================
      # STEP 15: VERIFY AUTO-SCALING OCCURRED
      # ============================================
      - name: ✅ Verify Auto-Scaling Behavior
        run: |
          echo "========================================="
          echo "✅ Auto-Scaling Verification"
          echo "========================================="
          
          echo "Initial pods: $INITIAL_PODS"
          echo "Final pods: $FINAL_PODS"
          echo "Max pods allowed: $MAX_PODS"
          echo ""
          
          if [ "$FINAL_PODS" -gt "$INITIAL_PODS" ]; then
            echo "✅ SUCCESS: Auto-scaling occurred!"
            echo "   Scaled from $INITIAL_PODS to $FINAL_PODS pods"
            echo "auto_scaling_success=true" >> load_test_results.txt
          else
            echo "⚠️  WARNING: No scaling observed"
            echo "   This might mean:"
            echo "   - Load was not high enough"
            echo "   - HPA not configured properly"
            echo "   - Metrics server needs time to collect data"
            echo "auto_scaling_success=false" >> load_test_results.txt
          fi
          
          echo ""
          echo "Final pod status:"
          kubectl get pods -l app=${{ env.IMAGE_NAME }} -o wide
      # ============================================
      # STEP 16: CREATE COMPREHENSIVE SUMMARY
      # ============================================
      - name: 📝 Create Deployment Summary
        if: always()
        run: |
          echo "Creating deployment summary..."
          
          # Create GitHub Actions Summary
          {
            echo "## 🚀 GKE Deployment with Load Testing"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Branch:** \`${{ github.ref_name }}\`"
            echo "**Triggered by:** @${{ github.actor }}"
            echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "---"
            echo ""
            echo "### 📦 Deployment Information"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| **Image** | \`$IMAGE_TAG\` |"
            echo "| **Cluster** | \`${{ env.GKE_CLUSTER }}\` |"
            echo "| **Region** | \`${{ env.GKE_REGION }}\` |"
            echo "| **Deployment** | \`${{ env.DEPLOYMENT_NAME }}\` |"
            echo "| **Service IP** | \`$SERVICE_IP\` |"
            echo ""
            
            echo "### 🌐 Service Endpoint"
            echo ""
            echo "✅ **Endpoint:** http://$SERVICE_IP"
            echo ""
            echo '```bash'
            echo "curl -X POST http://$SERVICE_IP/predict \\"
            echo '  -H "Content-Type: application/json" \'
            echo '  -d '"'"'{"sepal_length": 5.1, "sepal_width": 3.5, "petal_length": 1.4, "petal_width": 0.2}'"'"
            echo '```'
            echo ""
            
            if [ -f "wrk_output.txt" ]; then
              echo "### 🔥 Load Test Results"
              echo ""
              echo '```'
              cat wrk_output.txt
              echo '```'
              echo ""
            fi
            
            echo "### 📈 Auto-Scaling Results"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Initial Pods** | $INITIAL_PODS |"
            echo "| **Final Pods** | $FINAL_PODS |"
            echo "| **Max Pods (HPA)** | $MAX_PODS |"
            
            if [ "$FINAL_PODS" -gt "$INITIAL_PODS" ]; then
              echo "| **Scaling Status** | ✅ Successfully scaled from $INITIAL_PODS to $FINAL_PODS |"
            else
              echo "| **Scaling Status** | ⚠️  No scaling observed |"
            fi
            echo ""
            
            echo "### 📊 Current Cluster State"
            echo ""
            echo "**Pods:**"
            echo '```'
            kubectl get pods -l app=${{ env.IMAGE_NAME }} -o wide
            echo '```'
            echo ""
            
            echo "**HPA Status:**"
            echo '```'
            kubectl get hpa 2>/dev/null || echo "No HPA configured"
            echo '```'
            echo ""
            
            echo "### 🔍 Useful Commands"
            echo ""
            echo '```bash'
            echo "# View logs"
            echo "kubectl logs -l app=${{ env.IMAGE_NAME }} --tail=100"
            echo ""
            echo "# Check HPA status"
            echo "kubectl get hpa"
            echo "kubectl describe hpa"
            echo ""
            echo "# Manual scaling"
            echo "kubectl scale deployment/${{ env.DEPLOYMENT_NAME }} --replicas=3"
            echo ""
            echo "# Delete HPA"
            echo "kubectl delete hpa <hpa-name>"
            echo '```'
            
          } >> $GITHUB_STEP_SUMMARY
          
          echo "✅ Summary created!"
      # ============================================
      # STEP 17: UPLOAD ARTIFACTS
      # ============================================
      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            load_test_results.txt
            wrk_output.txt
            load_test.lua
          retention-days: 30
