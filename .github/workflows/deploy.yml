name: Build, Deploy, and Test

on:
  push:
    branches: 
      - week6

env:
  GAR_LOCATION: "us-central1"
  GKE_CLUSTER: "iris-cluster"
  GKE_REGION: "us-central1"
  REPOSITORY: "iris-app-repo"
  IMAGE_NAME: "iris-api"
  DEPLOYMENT_NAME: "iris-api-deployment"
  SERVICE_NAME: "iris-api-service"

jobs:
  build-deploy-test:
    name: Build, Deploy, and Test
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
      pull-requests: write 

    steps:
      # ============================================
      # STEP 1: CHECKOUT CODE
      # ============================================
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # ============================================
      # STEP 2: AUTHENTICATE TO GCP
      # ============================================
      - name: 🔐 Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ============================================
      # STEP 3: CONFIGURE DOCKER FOR ARTIFACT REGISTRY
      # ============================================
      - name: 🐳 Configure Docker for Artifact Registry
        run: |
          echo "Configuring Docker authentication..."
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # ============================================
      # STEP 4: BUILD AND PUSH DOCKER IMAGE
      # ============================================
      - name: 🏗️ Build and Push Docker Image
        id: build
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          
          echo "📦 Building image: $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" .
          
          echo "⬆️ Pushing image to Artifact Registry..."
          docker push "$IMAGE_TAG"
          
          echo "✅ Successfully pushed: $IMAGE_TAG"
          
          # Save for later steps
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # ============================================
      # STEP 5: INSTALL GKE AUTH PLUGIN
      # ============================================
      - name: 🔧 Install GKE Auth Plugin
        run: |
          echo "Installing gke-gcloud-auth-plugin..."
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates gnupg
          echo "deb [signed-by=/usr/share/keyrings/google-cloud.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
          curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/google-cloud.gpg
          sudo apt-get update -y
          sudo apt-get install -y google-cloud-cli-gke-gcloud-auth-plugin
          echo "✅ Plugin installed"

      # ============================================
      # STEP 6: GET GKE CREDENTIALS
      # ============================================
      - name: ☸️ Get GKE Cluster Credentials
        run: |
          echo "Getting cluster credentials..."
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} --region ${{ env.GKE_REGION }}
          
          echo "🔍 Verifying cluster connection..."
          kubectl cluster-info
          kubectl get nodes

      # ============================================
      # STEP 7: DEPLOY TO GKE
      # ============================================
      - name: 🚀 Deploy to GKE
        run: |
          echo "Deploying to GKE..."
          
          # Verify image tag
          if [ -z "$IMAGE_TAG" ]; then
            echo "❌ ERROR: Image tag is empty!"
            exit 1
          fi
          
          echo "📝 Updating deployment with image: $IMAGE_TAG"
          
          # Check if deployment.yaml exists and update it
          if [ -f "gke-deploy/deployment.yaml" ]; then
            sed -i "s|image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:.*|image: $IMAGE_TAG|g" gke-deploy/deployment.yaml
            
            echo "🔍 Verifying image tag update:"
            grep "image: ${{ env.GAR_LOCATION }}-docker.pkg.dev" gke-deploy/deployment.yaml
            
            echo "📋 Applying Kubernetes manifests..."
            kubectl apply -f gke-deploy/deployment.yaml
            
            if [ -f "gke-deploy/service.yaml" ]; then
              kubectl apply -f gke-deploy/service.yaml
            fi
            
            if [ -f "hpa.yaml" ]; then
              kubectl apply -f hpa.yaml
            fi
          else
            # Fallback: Update existing deployment directly
            echo "Using kubectl set image (no deployment.yaml found)..."
            kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
              iris-api-container=$IMAGE_TAG \
              --record
          fi
          
          echo "⏳ Waiting for deployment rollout..."
          if ! kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} --timeout=300s; then
            echo "❌ Deployment rollout failed!"
            echo ""
            echo "📦 Pod status:"
            kubectl get pods -l app=${{ env.IMAGE_NAME }} -o wide
            echo ""
            echo "📝 Deployment details:"
            kubectl describe deployment ${{ env.DEPLOYMENT_NAME }}
            echo ""
            echo "📜 Pod logs:"
            kubectl logs -l app=${{ env.IMAGE_NAME }} --tail=50 || echo "No logs available"
            exit 1
          fi
          
          echo "✅ Deployment successful!"
          echo ""
          echo "📊 Deployment status:"
          kubectl get deployment ${{ env.DEPLOYMENT_NAME }}
          echo ""
          echo "📦 Running pods:"
          kubectl get pods -l app=${{ env.IMAGE_NAME }}

      # ============================================
      # STEP 8: WAIT FOR SERVICE TO BE READY
      # ============================================
      - name: ⏳ Wait for Service External IP
        run: |
          echo "Waiting for LoadBalancer to assign external IP..."
          
          ATTEMPTS=0
          MAX_ATTEMPTS=30
          
          while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            SERVICE_IP=$(kubectl get service ${{ env.SERVICE_NAME }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
            
            if [ -n "$SERVICE_IP" ]; then
              echo "✅ Service is live at: http://$SERVICE_IP"
              echo "SERVICE_IP=$SERVICE_IP" >> $GITHUB_ENV
              break
            fi
            
            ATTEMPTS=$((ATTEMPTS + 1))
            echo "Attempt $ATTEMPTS/$MAX_ATTEMPTS: Waiting for IP..."
            sleep 10
          done
          
          if [ -z "$SERVICE_IP" ]; then
            echo "⚠️ LoadBalancer IP not assigned yet. This may take a few more minutes."
            echo "You can check later with: kubectl get service ${{ env.SERVICE_NAME }}"
            # Don't fail the workflow - just continue without testing
            echo "SERVICE_IP=" >> $GITHUB_ENV
          fi

      # ============================================
      # STEP 9: TEST THE ENDPOINT
      # ============================================
      - name: 🧪 Test Live Endpoint
        if: env.SERVICE_IP != ''
        run: |
          echo "Testing endpoint at: http://$SERVICE_IP"
          
          # Wait a bit for the service to be fully ready
          echo "Waiting 30 seconds for service to stabilize..."
          sleep 120
          
          echo "Running prediction test..."
          
          HTTP_CODE=$(curl -s -o prediction.json -w "%{http_code}" \
            -X POST "http://$SERVICE_IP:80/predict" \
            -H "Content-Type: application/json" \
            -d '{"sepal_length": 5.1, "sepal_width": 3.5, "petal_length": 1.4, "petal_width": 0.2}')
          
          echo "HTTP Response Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Endpoint is responding correctly!"
            echo "Response:"
            cat prediction.json
            echo ""
          else
            echo "⚠️ Unexpected response code: $HTTP_CODE"
            echo "Response:"
            cat prediction.json || echo "No response body"
          fi

      - name: 📝 Create Deployment Summary
        run: |
          echo "Creating deployment summary..."
          
          # Create GitHub Actions Summary (visible in workflow run)
          {
            echo "## 🚀 GKE Deployment Successful"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Branch:** \`${{ github.ref_name }}\`"
            echo "**Triggered by:** @${{ github.actor }}"
            echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "---"
            echo ""
            echo "### 📦 Deployment Information"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| **Image** | \`$IMAGE_TAG\` |"
            echo "| **Cluster** | \`${{ env.GKE_CLUSTER }}\` |"
            echo "| **Region** | \`${{ env.GKE_REGION }}\` |"
            echo "| **Deployment** | \`${{ env.DEPLOYMENT_NAME }}\` |"
            echo ""
            
            if [ -n "$SERVICE_IP" ]; then
              echo "### 🌐 Service Endpoint"
              echo ""
              echo "✅ **Endpoint is live:** http://$SERVICE_IP"
              echo ""
              echo "**Test the API:**"
              echo '```bash'
              echo "curl -X POST http://$SERVICE_IP/predict \\"
              echo '  -H "Content-Type: application/json" \'
              echo '  -d '"'"'{"sepal_length": 5.1, "sepal_width": 3.5, "petal_length": 1.4, "petal_width": 0.2}'"'"
              echo '```'
              echo ""
              
              if [ -f "prediction.json" ]; then
                echo "### 🧪 Prediction Test Result"
                echo ""
                echo "✅ **Status:** Endpoint responding correctly"
                echo ""
                echo '```json'
                cat prediction.json
                echo '```'
                echo ""
              fi
            else
              echo "### ⏳ Service Endpoint"
              echo ""
              echo "⚠️ **Status:** LoadBalancer IP is being provisioned"
              echo ""
              echo "Check status with:"
              echo '```bash'
              echo "kubectl get service ${{ env.SERVICE_NAME }}"
              echo '```'
              echo ""
            fi
            
            echo "### 📊 Pod Status"
            echo ""
            echo '```'
            kubectl get pods -l app=${{ env.IMAGE_NAME }} -o wide
            echo '```'
            echo ""
            echo "### 🔍 Quick Commands"
            echo ""
            echo '```bash'
            echo "# View logs"
            echo "kubectl logs -l app=${{ env.IMAGE_NAME }} --tail=100"
            echo ""
            echo "# Check deployment status"
            echo "kubectl get deployment ${{ env.DEPLOYMENT_NAME }}"
            echo ""
            echo "# Get service details"
            echo "kubectl get service ${{ env.SERVICE_NAME }}"
            echo ""
            echo "# Scale deployment"
            echo "kubectl scale deployment/${{ env.DEPLOYMENT_NAME }} --replicas=3"
            echo '```'
            
          } >> $GITHUB_STEP_SUMMARY
          
          echo "✅ Deployment summary created!"
          echo ""
          echo "📋 View the full report in the 'Summary' tab of this workflow run"
