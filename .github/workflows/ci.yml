name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r req.txt
          pip install pytest pandera

      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Configure DVC for CI
        run: |
          source venv/bin/activate
          dvc remote default gcsremote
          dvc config core.hardlink_lock true

      - name: Pull DVC tracked files
        run: |
          source venv/bin/activate
          dvc pull

      - name: Run unit tests and generate CML report
        run: |
          source venv/bin/activate
          echo "## Test Results" >> cml_report.md
          pytest --tb=short --disable-warnings >> cml_report.md 2>&1 || echo "Test failed" >> cml_report.md
          echo "Test completed on $(data)" >> cml_report.md


      - name: Create CML report as a PR comment
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source venv/bin/activate
          cml comment create cml_report.md

